name: Run UI Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Run tests in container
        run: docker run -v ${{ github.workspace }}/allure-results:/app/allure-results playwright-tests
        continue-on-error: true

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure-2.27.0.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy to Netlify
        if: always()
        id: netlify-deploy
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: 'allure-report'
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Send report link to Telegram
        if: always()
        run: |
          PASSED=$(jq -r '.status' allure-results/*-result.json 2>/dev/null | grep -c "^passed$")
          FAILED=$(jq -r '.status' allure-results/*-result.json 2>/dev/null | grep -c "^failed$")
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -d text="UI Tests Results: %0A✅ Passed: $PASSED%0A❌ Failed: $FAILED%0A📊 Report: ${{ steps.netlify-deploy.outputs.deploy-url }}"